name: Release Manifest

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute clean version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          CLEAN="${TAG#v}"
          echo "clean=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Update public app-update manifest on default branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          CLEAN="${{ steps.version.outputs.clean }}"
          APK_NAME="RicosMealtracker-${CLEAN}.apk"
          REPO="${{ github.repository }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/${APK_NAME}"

          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"

          cat > public/app-update-manifest.json <<EOF
          {
            "version": "${CLEAN}",
            "apk_url": "${APK_URL}",
            "notes": "Auto-published from GitHub Actions tag ${TAG}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- public/app-update-manifest.json; then
            echo "Manifest already up to date."
            exit 0
          fi

          git add public/app-update-manifest.json
          git commit -m "chore: update app manifest for ${TAG}"
          git push origin "$DEFAULT_BRANCH"
